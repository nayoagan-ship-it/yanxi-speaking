<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f2"><meta name="description" content="每天开口十分钟。练习中文表达与英语跟读，通过录音回听和自动分析，让表达更顺、更清楚。">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>言习 · 把想法，说得更好</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./english.css">
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5c-3-2-7-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-7-1-10 1Zm0 0v15"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v18h17M8 15v2m5-8v8m5-12v12"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17l-6-4-6 4Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-14-3L3 8m0-5v5h5m-4 8a8 8 0 0 0 14 3l3-3m0 5v-5h-5"/></symbol>
    <symbol id="i-tune" viewBox="0 0 24 24"><path d="M4 7h7m5 0h4M4 17h3m5 0h8"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="12" width="4" height="8" rx="2"/><rect x="17" y="12" width="4" height="8" rx="2"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.2"/></symbol>
  </defs></svg>
  <div class="phone-shell">
    <header class="topbar"><a href="#practice" class="brand" aria-label="言习首页"><span class="brand-mark">言</span><span>言习<small>让表达，慢慢变好</small></span></a><button class="icon-button" id="help-button" aria-label="使用帮助"><svg><use href="#i-info"/></svg></button></header>
    <div class="language-switch" role="group" aria-label="选择练习语言"><button data-language="zh" class="active" aria-pressed="true"><span>中文表达</span><small>CHINESE</small></button><button data-language="en" aria-pressed="false"><span>English 口语</span><small>LISTEN &amp; SPEAK</small></button></div>
    <main id="app" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="主导航">
      <button data-view="practice" class="selected"><svg><use href="#i-mic"/></svg><span>练习</span></button>
      <button data-view="history"><svg><use href="#i-chart"/></svg><span>练习记录</span></button>
      <button data-view="favorites"><svg><use href="#i-bookmark"/></svg><span>我的收藏</span></button>
    </nav>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-handle"></div><div id="sheet-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>请开启 JavaScript 后使用中英口语练习。</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
